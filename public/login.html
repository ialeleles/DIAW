<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="formularioLogin">
        <section id="usuario">
            <input id="input-usuario" type="text" placeholder="insira o nome de usuário">
        </section>

        <section id="senha">
            <input id="input-senha" type="password" placeholder="insira a senha">
        </section>

        <button id="btn-enviar">Entrar</button>

        <script src="script.js"></script>
    </form>
</body>
</html>
