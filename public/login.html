<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-login">
    
    <form id="formularioLogin">
        <h1>Login</h1>
            <section id="usuario">
                <input id="input-usuario" type="text" placeholder="insira o nome de usuário">
            </section>

            <section id="senha">
                <input id="input-senha" type="password" placeholder="insira a senha">
            </section>

            <button id="btn-enviar">Entrar</button>

        <script src="script.js"></script>
    </form>
</body>
</html>
