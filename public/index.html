<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Produtos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>CRUD de Produtos</h1>
        <button id="btn-sair" type="button">Sair</button>
    </header>

    <section>
        <h2 id="form-title">Cadastrar Novo Produto</h2>
        <form id="form-produto">

            <input type="hidden" id="produto-id">

            <div>
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>
            </div>

            <div>
                <label for="preco">Preço:</label>
                <input type="number" id="preco" step="0.01" min="0" required>
            </div>

            <div>
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" required>
            </div>

            <div>
                <label for="estoque">Estoque:</label>
                <input type="number" id="estoque" min="0" required>
            </div>

            <button type="submit" id="btn-salvar">Salvar</button>
        </form>
    </section>

    <section>
        <h2 id="lista-produtos">Lista de Produtos</h2>
            <table>
                <tr id="linha-cabecalho">
                    <td><b>ID</b></td>
                    <td><b>Descrição</b></td>
                    <td><b>Preço</b></td>
                    <td><b>Categoria</b></td>
                    <td><b>Estoque</b></td>
                    <td><b>Ações</b></td>
                </tr>
            </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
